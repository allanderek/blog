baseURL = 'https://blog.poleprediction.com'
languageCode = 'en-us'
title = "Allanderek's blog"

[params]
  author = "Allan Clark"
  description = "The thoughts of a programmer, heavily slanted towards development in Elm, but occasionally more general programming."
  mainSections = ["posts"]

# Favicons live in static/favicons/ rather than loose in the site root.
# The theme falls back to root-level names (favicon.ico, favicon-16x16.png,
# ...) when these are unset, which is why they 404'd before.
[params.assets]
  favicon = "/favicons/favicon.ico"
  favicon16x16 = "/favicons/favicon-16x16.png"
  favicon32x32 = "/favicons/favicon-32x32.png"
  apple_touch_icon = "/favicons/apple-touch-icon.png"

[menu]
  [[menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 5
  [[menu.main]]
    name = "Consulting"
    url = "/consulting/"
    weight = 8
  [[menu.main]]
    name = "RSS Feed"
    url = "/rss/index.xml"
    weight = 100  # Higher weight will place it at the end of the menu
    

[pagination]
  disableAliases = false
  pagerSize = 100
  path = 'page'

[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.ATOM]
    mediaType = "application/atom+xml"
    isPlainText = false
    rel = "alternate"
    isHTML = false
    noUgly = true
    permalinkable = false
    path = "/rss"

[outputs]
  home = ["HTML", "RSS", "ATOM"]
