# --- Personal statement / summary -------------------------------------------

[[section]]
title = "PERSONAL STATEMENT / SUMMARY"
kind  = "expandable"

  [[section.item]]
  summary = "Developed a new programming language and an associated compiler with features to aid in the correction of programming errors."
  detail = """During my PhD I developed a new programming language named Nitro.
The purpose of Nitro was to bridge the gap between applications
programming languages and the system programming languages that are
used to provide the runtime services, such as automatic memory
management, for these application languages. To do this Nitro allows
the user to not only specify types but how those types are represented
in memory. Because such memory representations are formally specified
the type-checker can then ensure that they are used correctly.
As part of my PhD I developed the language, specified formally in
structural operational semantics, proved some useful properties that
the language has, developed a stable compiler for the Nitro language,
and used it to write some software such as a text editor which used
the NCurses library directly without any need to marshal the native
NCurses data types into a Nitro data type."""

  [[section.item]]
  summary = "High-level problem solving research experience, dependent on the development of software for other users with complex requirements."
  detail = """I was involved in the [PEPA research group.](https://www.dcs.ed.ac.uk/pepa) PEPA is a language for expressing mathematical models of systems, which is used to
investigate properties of many different kinds of systems from server-client systems,
distributed systems, epidemiology processes, and the modelling of crowds. Bio-PEPA is
a varient of PEPA particularly suitable for systems biology modelling. Users typically
create a model of the system under investigation and then ask performance related queries
such as: *What is the average number of waiting customers?* or *What is the probability that a request has been served within a given time constraint?*"""

  [[section.item]]
  summary = "Developed several individual and team based software projects related to formal analysis of models written in a process algebra which were used by researchers from across the globe."

  [[section.item]]
  summary = "Ability to understand and improve existing software projects."
  detail = """I have taken over the development and/or joined the development
team on several projects in a variety of programming languages, for example:

- I took on the development of the Imperial PEPA Compiler written in
  Haskell and completely revamped the project such that it was
  re-named the International PEPA compiler and published as library,
  its source code can be found [here.](https://github.com/allanderek/ipclib)
- I joined the development teams on both Eclipse plug-ins for
  the PEPA and Bio-PEPA languages. These projects are written
  Java and their related source code repositories can be found [here](https://github.com/allanderek/pepa) and [here.](https://github.com/allanderek/Bio-PEPA)
- I joined the [SBSI](http://www.sbsi.ed.ac.uk/) development team, mostly working on the SBSI-numerics component written in C++."""

  [[section.item]]
  summary = "An award-winning teacher with a diverse publication record of over 30 articles; a proven track record of understanding and communicating complex concepts and ideas."

  [[section.item]]
  summary = "My expertise is in building high quality, intuitive, and robust software; and I wish to join a team that builds software for a large and diverse user pool."

