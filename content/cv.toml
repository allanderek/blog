# --- Employment ----------------------------------------------------------------

[[section]]
title = "EMPLOYMENT"
kind  = "expandable"

  [[section.item]]
  summary = "2019—2025 Co-founder Pakk Software."
  detail = """Pakk Software developed an e-commerce platform specifically for small-to-medium sized businesses.
Our proposition was that the Pakk software would handle all aspects of a business looking to sell physical products online.
To that end our software provided the e-commerce store visited by customers as well as an admin panel for the businness owner and/or employees
to manage the store. Including (but not exhaustively), designing the look of the store, managing stock, promotions, loyalty schemes,
returns, customer service, purchase orders, and accounting. Because everything was integrated a store owner could for example know not just
how much stock of a particular product, but the booked value of that stock as well as the expected profit from selling all of that stock.

My main role was a front-end software developer. Which means I was responsible for the front-end user interface of both the
customer facing e-commerce store and the merchant facing admin panel. Both significant, large and complex software projects.
Most of the front-end code was written in the functional programming language Elm. As such I have become an expert not just in Elm,
but specifically large Elm applications, and through the work on the admin panel, generalised software."""

  [[section.item]]
  summary = "2017-2019 Joined a startup with equity in the sports and gaming sector, looking to provide daily/weekly fantasy sports games."

  [[section.item]]
  summary = "2016-2017 Contracted software developer for an innovative start-up looking to disrupt the pre-employment background-screening and reference-checking services sector."

  [[section.item]]
  summary = "2015 Freelance software developer"

  [[section.item]]
  summary = "2012—2015 LECTURER, SCHOOL OF INFORMATICS, THE UNIVERSITY OF EDINBURGH."
  detail = """I have lectured 4<sup>th</sup> year undergraduate and Masters courses, Distributed Systems and Software Architecture, Process, and Management. Both courses had over 120 students however I engaged well with the students enough to win a Teaching Award for the feedback I gave to students. I have also taught two 3<sup>rd</sup> year undergraduate courses the Computer Science Large Practical and the Software Engineering Large Practical. Both are core courses for 3<sup>rd</sup> year students and involve lectures as well as the setting and grading of a substantial individual practical. In addition, I have tutored 1<sup>st</sup> year students learning to program in Haskell and Java. I have also supervised several students through their Masters or 4<sup>th</sup> year undergraduate projects, guiding many to first class awards.

After my teaching award I was appointed as the feedback officer for the school of Informatics with the remit of improving the school's scores for feedback on student surveys, a remit that was achieved every year for which I was the school's feedback officer.

I was also tasked with the role of personal tutor for approximately 20 students each year. This role, is mostly a pastoral role guiding students through their studies but does involve exercising judgement in suggesting study directions/courses for students.

Alongside this I continued research as part of the PEPA group and in particular made contributions towards the QUANTICOL project including data collection, analysis and modelling of the City of Edinburgh's bus services. Developing almost exclusively in Python."""

  [[section.item]]
  summary = "2010—2012 Post-Doctoral Researcher, School of Informatics/CSBE, the University of Edinburgh."
  detail = """Continued my role as a post-doctoral researcher but was now jointly affiliated with the School of Informatics and the Centre for Systems Biology at Edinburgh (which is now a part of [SynthSys](https://web.archive.org/web/20200815095153/http://www.synthsys.ed.ac.uk/)). This has lead me both to focus more energy on biologically themed models (and their associated solution techniques) as well as become part of a development team for the [SBSI](http://www.sbsi.ed.ac.uk) software. I was once again developing in Haskell, Python, and Java, but also maintaining legacy C code."""

  [[section.item]]
  summary = "2006—2010 Post-Doctoral Researcher, School of Informatics, the University of Edinburgh."
  detail = """I became a member of the PEPA modelling research group. PEPA is a language for modelling complex systems and reasoning about their performance (or timing) properties. My research involved developing new solution techniques and new methods to specify the model and importantly the queries of those models. As a part of this I wrote sofware to support these modelling innovations as well as collaborate with others to incorporate their new insights into my software. Developing mostly in Haskell, Java and Python."""

  [[section.item]]
  summary = "2002—2006 Student Tutor, the University of Edinburgh. Collaborative work between Schools."

